services:
  - type: web
    name: the-rehearsal-api
    runtime: docker
    plan: free
    numInstances: 1
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Free-host fallback. For durable retrieval use render-persistent.yaml.
      - key: VECTOR_STORE
        value: memory
      - key: SPEECH_ENABLED
        value: "true"
      - key: REHEARSAL_AGENT_ENABLED
        value: "true"
      - key: REHEARSAL_MODE
        value: live
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: API_PROXY_TOKEN
        sync: false
