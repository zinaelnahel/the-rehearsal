name: LangSmith evaluation
on:
  workflow_dispatch:
    inputs:
      live:
        description: Run paid provider generation and model judges on fictional fixtures
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: evaluation
    env:
      REHEARSAL_MODE: demo
      API_PROXY_TOKEN: ''
      VECTOR_STORE: chroma
      CHROMA_PATH: .runtime/chroma-evaluation
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LANGSMITH_PROJECT: the-rehearsal-evaluation
      LANGSMITH_ENDPOINT: ${{ vars.LANGSMITH_ENDPOINT || 'https://api.smith.langchain.com' }}
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
      REHEARSAL_AGENT_ENABLED: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Run traced synthetic experiment
        env:
          RUN_LIVE: ${{ inputs.live }}
        run: |
          if [ "$RUN_LIVE" = 'true' ]; then
            python scripts/evaluate_langsmith.py --live --judge
          else
            python scripts/evaluate_langsmith.py
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: langsmith-evaluation
          path: .runtime/langsmith-evaluation.json
          retention-days: 14
