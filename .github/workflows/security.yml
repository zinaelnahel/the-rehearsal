name: Dependency security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python -m venv .runtime/audit-venv
      - run: .runtime/audit-venv/bin/python -m pip install pip-audit==2.10.1
      - run: .runtime/audit-venv/bin/python scripts/check_dependency_audit.py
      - run: npm audit --audit-level=low
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: dependency-security-audit
          path: .runtime/dependency-audit.json
          include-hidden-files: true
          retention-days: 14
