name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and RAG evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REHEARSAL_MODE: demo
      OPENAI_API_KEY: ''
      API_PROXY_TOKEN: ''
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
      VECTOR_STORE: memory
      REHEARSAL_AGENT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s backend -t . -p 'test_*.py' -v
      - run: python scripts/evaluate_rag.py
      - run: python scripts/evaluate_quality.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rag-evaluation
          path: |
            .runtime/rag-evaluation.json
            .runtime/quality-evaluation*.json
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

  container:
    name: Backend Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag rehearsal-ci .
