name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and RAG evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REHEARSAL_MODE: demo
      OPENAI_API_KEY: ''
      API_PROXY_TOKEN: ''
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
      API_REQUESTS_PER_MINUTE: '100000'
      API_CLIENT_REQUESTS_PER_MINUTE: '100000'
      PROVIDER_DAILY_BUDGET_USD: '100000'
      PROVIDER_BUDGET_PATH: .runtime/test-provider-budget.sqlite3
      VECTOR_STORE: memory
      REHEARSAL_AGENT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python scripts/lock_dependencies.py --check
      - name: Install OCR dependencies from official Ubuntu mirrors
        run: |
          # The runner's Azure mirror has failed DNS before tests can start.
          # Keep Ubuntu's signed repositories and bound transient network waits.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
          if [ -f /etc/apt/apt-mirrors-security.txt ]; then
            printf '%s\n' 'https://security.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors-security.txt > /dev/null
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends libtesseract5 tesseract-ocr-eng tesseract-ocr-deu tesseract-ocr-spa
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - run: python -m unittest discover -s backend -t . -p 'test_*.py' -v
      - run: python scripts/evaluate_rag.py
      - run: python scripts/evaluate_quality.py --dataset evaluation/quality-release-dataset.json
      - run: python scripts/evaluate_role_boundaries.py
      - run: python scripts/evaluate_dialogue.py --output .runtime/dialogue-offline.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: rag-evaluation
          path: |
            .runtime/rag-evaluation.json
            .runtime/quality-evaluation*.json
            .runtime/role-boundaries.json
            .runtime/dialogue-offline*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:locales
      - run: npm run test:voice
      - run: npm run test:library
      - run: npm run test:media
      - run: npm run test:video
      - run: node --test scripts/test_mission_plan.mjs
      - run: node --test scripts/test_request_deadline.mjs
      - run: node --test scripts/test_source_highlights.mjs
      - run: node --test scripts/test_owner_feedback.mjs
      - run: npm run build

  container:
    name: Backend Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag rehearsal-ci .

      - run: docker run --rm --entrypoint python rehearsal-ci -m backend.sandbox_probe
