name: Release

on:
  workflow_dispatch:
    inputs:
      require_langsmith:
        description: Require a successful LangSmith experiment workflow for this commit
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Request production deployments
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success" \
            --jq '.workflow_runs | length > 0' | grep -qx true
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$latest" = "$GITHUB_SHA" || { echo 'Main has advanced. Run Release on the latest commit after CI passes.'; exit 1; }
      - name: Require LangSmith evaluation for this commit
        if: inputs.require_langsmith
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/langsmith-evaluation.yml/runs?head_sha=$GITHUB_SHA&event=workflow_dispatch&status=success" \
            --jq '.workflow_runs | length > 0' | grep -qx true
      - name: Require dependency security checks for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/security.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success" \
            --jq '.workflow_runs | length > 0' | grep -qx true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Require current independent human-reviewed live quality evidence
        env:
          REHEARSAL_MODE: demo
          OPENAI_API_KEY: ''
          VECTOR_STORE: memory
        run: |
          test -f evaluation/quality-release-live.json || { echo 'Missing live benchmark report'; exit 1; }
          test -f evaluation/quality-release-live.review.json || { echo 'Missing attributed human reviews'; exit 1; }
          python scripts/evaluate_quality.py --score-report evaluation/quality-release-live.json --reviews evaluation/quality-release-live.review.json --output .runtime/release-reviewed.json --require-human
          python scripts/check_review_provenance.py .runtime/release-reviewed.json
      - name: Check deploy hook configuration
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK" || { echo 'Missing RENDER_DEPLOY_HOOK'; exit 1; }
          test -n "$VERCEL_DEPLOY_HOOK" || { echo 'Missing VERCEL_DEPLOY_HOOK'; exit 1; }
      - name: Request Render deployment of tested commit
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl --fail --silent --show-error --max-time 60 --request POST \
            --get --data-urlencode "ref=$GITHUB_SHA" "$RENDER_DEPLOY_HOOK" --output /dev/null
      - name: Request Vercel deployment
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          curl --fail --silent --show-error --max-time 60 --request POST "$VERCEL_DEPLOY_HOOK" --output /dev/null
      - name: Record deployment requests
        run: |
          echo 'Deployment requests accepted. Check Render and Vercel for build completion and production health.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Render targets the tested commit. Vercel deploy hooks target the current head of their configured branch.' >> "$GITHUB_STEP_SUMMARY"
